# XcodeGen spec — generates the Xcode project that builds the real .app bundles.
#
#   brew install xcodegen      # one-time
#   xcodegen generate          # creates Councis.xcodeproj
#   open Councis.xcodeproj     # pick the CouncisMac or councis scheme, then Run
#
# The App targets link the Swift Package products in this repo. The iOS app links
# ONLY the chat subset (no Tools / Permission / AgentKernel / Cowork).

name: Councis

options:
  bundleIdPrefix: com.Vita0818
  deploymentTarget:
    macOS: "13.0"
    iOS: "16.0"
  createIntermediateGroups: true
  localPackagesGroup: "Internal Modules"

packages:
  Intatis:
    path: .

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.5.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "NO"
    # To run on a device or archive for distribution, set your team:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:

  # ---- macOS app: branded wrapper that links the shared runtime but exposes strict Cowork only ----
  CouncisMac:
    type: application
    platform: macOS
    sources:
      - Apps/CouncisMac/Sources
      - Apps/IntatisMac/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.CouncisMac
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Councis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Councis — clean-room. See NOTICE.md."
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) COUNCIS_APP"
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: Apps/CouncisMac/CouncisMac.DeveloperID.entitlements
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI
      - package: Intatis
        product: IntatisTools
      - package: Intatis
        product: IntatisPermission
      - package: Intatis
        product: IntatisAgentKernel
      - package: Intatis
        product: IntatisCowork
      - package: Intatis
        product: IntatisMacTeamSupport

  # ---- CLI: existing `councis` command ----
  councis:
    type: tool
    platform: macOS
    sources:
      - Apps/intatis-cli/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Councis
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisTools
      - package: Intatis
        product: IntatisPermission
      - package: Intatis
        product: IntatisAgentKernel
      - package: Intatis
        product: IntatisCowork

  # ---- macOS app: full Chat / Code / Cowork (11 shared Intatis modules + TeamSupport) ----
  IntatisMac:
    type: application
    platform: macOS
    sources:
      - Apps/IntatisMac/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.IntatisMac
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Intatis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Intatis — clean-room. See NOTICE.md."
        ENABLE_HARDENED_RUNTIME: "YES"
        CODE_SIGN_ENTITLEMENTS: Apps/IntatisMac/IntatisMac.DeveloperID.entitlements
        # AppStore/chat-only builds can switch back to the sandboxed entitlement
        # together with AppConfig.platformProfile = .macAppStore.
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI
      - package: Intatis
        product: IntatisTools
      - package: Intatis
        product: IntatisPermission
      - package: Intatis
        product: IntatisAgentKernel
      - package: Intatis
        product: IntatisCowork
      - package: Intatis
        product: IntatisMacTeamSupport

  # ---- iOS app: chat-only SUBSET (deliberately no workspace stack) ----
  IntatisiOS:
    type: application
    platform: iOS
    sources:
      - Apps/IntatisiOS/Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Intatis
        TARGETED_DEVICE_FAMILY: "1,2"
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Intatis
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Intatis uses the microphone for voice input transcription."
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI

schemes:
  CouncisMac:
    build:
      targets:
        CouncisMac: all
    run:
      config: Debug
  councis:
    build:
      targets:
        councis: all
    run:
      config: Debug
  IntatisMac:
    build:
      targets:
        IntatisMac: all
    run:
      config: Debug
  IntatisiOS:
    build:
      targets:
        IntatisiOS: all
    run:
      config: Debug
