# XcodeGen spec — generates the Xcode project that builds the real .app bundles.
#
#   brew install xcodegen      # one-time
#   xcodegen generate          # creates Councis.xcodeproj
#   open Councis.xcodeproj     # pick the CouncisMac scheme, then Run
#
# The macOS App target links the Swift Package products in this repo.

name: Councis

options:
  bundleIdPrefix: com.Vita0818
  developmentLanguage: en
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  localPackagesGroup: "Internal Modules"
  postGenCommand: "sh scripts/hide-xcode-package-schemes.sh"

packages:
  Intatis:
    path: ../Intatis

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.10"
    CURRENT_PROJECT_VERSION: "49"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: "NO"
    # To run on a device or archive for distribution, set your team:
    # DEVELOPMENT_TEAM: ABCDE12345

targets:

  # ---- macOS DeveloperID app: Chat / Code / Cowork + stdio/HTTP MCP client ----
  CouncisMac:
    type: application
    platform: macOS
    productName: Councis
    sources:
      - Apps/CouncisMac/Sources
      - Apps/CouncisMac/Resources
      - Sources/CouncisProductSupport
      - path: Councis.icon
        buildPhase: resources
      - path: Apps/SharedResources
        buildPhase: resources
      - path: NOTICE.md
        buildPhase: resources
      - path: ../Intatis/ThirdPartyNotices
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.Vita0818.Councis
        PRODUCT_NAME: Councis
        # Let Xcode synthesize Info.plist (injects CFBundleExecutable etc.).
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleName: Councis
        INFOPLIST_KEY_CFBundleDisplayName: Councis
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 Councis contributors. See NOTICE.md."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Councis uses the microphone to turn voice into editable message drafts."
        ASSETCATALOG_COMPILER_APPICON_NAME: Councis
        CODE_SIGN_ENTITLEMENTS: Apps/CouncisMac/CouncisMac.DeveloperID.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
        ENABLE_RESOURCE_ACCESS_AUDIO_INPUT: "YES"
    dependencies:
      - package: Intatis
        product: IntatisCore
      - package: Intatis
        product: IntatisProtocol
      - package: Intatis
        product: IntatisProviders
      - package: Intatis
        product: IntatisConversation
      - package: Intatis
        product: IntatisArtifacts
      - package: Intatis
        product: IntatisMultimodal
      - package: Intatis
        product: IntatisSharedUI
      - package: Intatis
        product: IntatisTools
      - package: Intatis
        product: IntatisKnowledge
      - package: Intatis
        product: IntatisPermission
      - package: Intatis
        product: IntatisAgentKernel
      - package: Intatis
        product: IntatisSkills
      - package: Intatis
        product: IntatisCowork
      - package: Intatis
        product: IntatisMCP
      - package: Intatis
        product: IntatisMCPStdio
      - package: Intatis
        product: IntatisCodexRuntime

schemes:
  CouncisMac:
    build:
      targets:
        CouncisMac: all
    run:
      config: Debug
    management:
      shared: true
      orderHint: 0
      isShown: true
